name: noa-motion
on:
  workflow_dispatch:
    inputs:
      only:
        description: comma separated names, empty means all
        required: false
        default: ""
      dur:
        description: seconds per clip
        required: false
        default: "3"
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q gradio_client pillow
      - name: Render Noa clips
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ONLY: ${{ inputs.only }}
          DUR: ${{ inputs.dur }}
          JOBS_JSON: "[{\"name\": \"noa_abduction\", \"ex\": \"abduction\", \"heb\": \"\u05d4\u05e8\u05d7\u05e7\u05ea \u05d9\u05e8\u05da\", \"prompt\": \"Same woman, same purple lace top and purple lace briefs, bright studio, fixed wide camera, whole body in frame. She stands tall and lifts her straight right leg out to the side to hip height, holds for a moment, lowers it back, and repeats the movement slowly and continuously. Smooth athletic motion, stable balance.\"}, {\"name\": \"noa_lateral_walk\", \"ex\": \"lateral_walk\", \"heb\": \"\u05d4\u05dc\u05d9\u05db\u05d4 \u05e6\u05d9\u05d3\u05d9\u05ea\", \"prompt\": \"Same woman, same purple lace outfit, bright studio, fixed wide camera, whole body in frame. She steps sideways in a low athletic stance, left foot out then right foot follows, three steps to the side, band tension on her thighs, continuous smooth side stepping motion.\"}, {\"name\": \"noa_kickback\", \"ex\": \"kickback\", \"heb\": \"\u05d1\u05e2\u05d9\u05d8\u05ea \u05d9\u05e9\u05d1\u05df\", \"prompt\": \"Same woman, same purple lace outfit, bright studio, fixed wide camera, whole body in frame. She stands leaning slightly forward with hands on hips, right leg straight, and kicks her leg back and up behind her, squeezes, returns, keeps repeating slowly. Continuous smooth motion.\"}, {\"name\": \"noa_donkey_kick\", \"ex\": \"donkey_kick\", \"heb\": \"\u05d1\u05e2\u05d9\u05d8\u05ea \u05d7\u05de\u05d5\u05e8\", \"prompt\": \"Same woman, same purple lace outfit, bright studio, fixed side camera, whole body in frame. She is on all fours and pushes her bent right leg up behind her so the sole faces the ceiling, then lowers it and repeats, back staying flat. Continuous smooth motion, correct anatomy.\"}, {\"name\": \"noa_glute_bridge\", \"ex\": \"glute_bridge\", \"heb\": \"\u05d2\u05e9\u05e8 \u05d9\u05e9\u05d1\u05df\", \"prompt\": \"Same woman, same purple lace outfit, bright studio, fixed side camera, whole body in frame. She lies on her back with feet planted and lifts her hips up until her body makes a straight line from knees to shoulders, squeezes, lowers, repeats. Continuous smooth motion.\"}, {\"name\": \"noa_hip_thrust\", \"ex\": \"hip_thrust\", \"heb\": \"\u05d4\u05d9\u05e4 \u05ea\u05e8\u05d0\u05e1\u05d8\", \"prompt\": \"Same woman, same purple lace outfit, bright studio, fixed side camera, whole body in frame. Her upper back rests on the bench, she lowers her hips toward the floor and drives them up until her hips are fully extended, holds, lowers, repeats. Continuous smooth motion.\"}, {\"name\": \"noa_rdl\", \"ex\": \"rdl\", \"heb\": \"\u05d3\u05d3\u05dc\u05d9\u05e4\u05d8 \u05e8\u05d5\u05de\u05e0\u05d9\", \"prompt\": \"Same woman, same purple lace outfit, bright studio, fixed side camera, whole body in frame. She stands with a light bar and hinges at the hips, pushing her hips back and lowering the bar down her thighs while her back stays flat, then stands tall again, repeating slowly. Continuous smooth motion.\"}, {\"name\": \"noa_single_rdl\", \"ex\": \"single_rdl\", \"heb\": \"\u05d3\u05d3\u05dc\u05d9\u05e4\u05d8 \u05e8\u05d2\u05dc \u05d0\u05d7\u05ea\", \"prompt\": \"Same woman, same purple lace outfit, bright studio, fixed side camera, whole body in frame. She balances on one leg and hinges forward at the hip while the free leg lifts straight behind her, then returns upright, repeating. Continuous smooth balanced motion.\"}, {\"name\": \"noa_good_morning\", \"ex\": \"good_morning\", \"heb\": \"\u05d2\u05d5\u05d3 \u05de\u05d5\u05e8\u05e0\u05d9\u05e0\u05d2\", \"prompt\": \"Same woman, same purple lace outfit, bright studio, fixed side camera, whole body in frame. With a light bar across her shoulders she bends forward from the hips with a flat back until her torso is near parallel, then stands up, repeating slowly. Continuous smooth motion.\"}, {\"name\": \"noa_bulgarian\", \"ex\": \"bulgarian\", \"heb\": \"\u05e1\u05e7\u05d5\u05d5\u05d0\u05d8 \u05d1\u05d5\u05dc\u05d2\u05e8\u05d9\", \"prompt\": \"Same woman, same purple lace outfit, bright studio, fixed wide camera, whole body in frame. Her rear foot rests on a bench behind her, she lowers into a deep split squat on the front leg and pushes back up, repeating slowly and steadily. Continuous smooth motion.\"}, {\"name\": \"noa_lunge\", \"ex\": \"lunge\", \"heb\": \"\u05dc\u05d0\u05e0\u05d2'\", \"prompt\": \"Same woman, same purple lace outfit, bright studio, fixed wide camera, whole body in frame. She steps forward into a long lunge, back knee lowering toward the floor, then pushes back to standing, alternating legs, continuous smooth motion.\"}, {\"name\": \"noa_step_up\", \"ex\": \"step_up\", \"heb\": \"\u05e2\u05dc\u05d9\u05d9\u05ea \u05de\u05d3\u05e8\u05d2\u05d4\", \"prompt\": \"Same woman, same purple lace outfit, bright studio, fixed wide camera, whole body in frame. She steps up onto a box with one leg, drives up to full standing on the box, then steps back down, repeating. Continuous smooth motion.\"}, {\"name\": \"noa_squat_pulse\", \"ex\": \"squat_pulse\", \"heb\": \"\u05e1\u05e7\u05d5\u05d5\u05d0\u05d8 \u05e4\u05d5\u05dc\u05e1\", \"prompt\": \"Same woman, same purple lace outfit, bright studio, fixed wide camera, whole body in frame. She squats down into a half squat and pulses up and down in small continuous movements without standing fully, arms in front for balance. Continuous smooth motion.\"}, {\"name\": \"noa_sumo_squat\", \"ex\": \"sumo_squat\", \"heb\": \"\u05e1\u05e7\u05d5\u05d5\u05d0\u05d8 \u05e1\u05d5\u05de\u05d5\", \"prompt\": \"Same woman, same purple lace outfit, bright studio, fixed front camera, whole body in frame. She stands with a wide stance and toes out, lowers into a deep sumo squat with hands in front of her chest, then drives back up, repeating slowly. Continuous smooth motion.\"}]"
        run: |
          cat > /tmp/r.py <<'PYEOF'
          import os, json, base64, urllib.request

          API = "https://api.github.com/repos/sunraz/shimi-land"
          TOK = os.environ["GH_TOKEN"]
          SPACE = "Lightricks/ltx-video-distilled"
          NEG = "worst quality, inconsistent motion, blurry, jittery, distorted, extra limbs, deformed body"
          JOBS = json.loads(os.environ["JOBS_JSON"])
          ONLY = [x for x in os.environ.get("ONLY", "").split(",") if x]
          OUT = "/tmp/clips"
          os.makedirs(OUT, exist_ok=True)


          def gh(method, path, payload=None):
              data = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(API + path, data=data, method=method,
                                           headers={"Authorization": "token " + TOK,
                                                    "Accept": "application/vnd.github+json",
                                                    "Content-Type": "application/json"})
              return json.loads(urllib.request.urlopen(req, timeout=120).read())


          from gradio_client import Client, handle_file

          tok = os.environ.get("HF_TOKEN") or None
          done, failed = [], []
          for j in JOBS:
              if ONLY and j["name"] not in ONLY and j["ex"] not in ONLY:
                  continue
              dst = os.path.join(OUT, j["name"] + ".mp4")
              try:
                  print("[render]", j["name"], flush=True)
                  kw = {"token": tok} if tok else {}
                  c = Client(SPACE, verbose=False, **kw)
                  r = c.predict(prompt=j["prompt"], negative_prompt=NEG,
                                input_image_filepath=handle_file("https://aidoor.shimi.land/fit-noa/coach/ex/%s.jpg" % j["ex"]),
                                input_video_filepath=None, height_ui=832, width_ui=896,
                                mode="image-to-video", duration_ui=int(os.environ.get("DUR","3")), ui_frames_to_use=9,
                                seed_ui=42, randomize_seed=True, ui_guidance_scale=1,
                                improve_texture_flag=True, api_name="/image_to_video")
                  src = r[0]["video"] if isinstance(r[0], dict) else r[0]
                  with open(dst, "wb") as f, open(src, "rb") as s:
                      f.write(s.read())
                  print("  ok", os.path.getsize(dst), flush=True)
                  done.append(j["name"])
              except Exception as e:
                  m = str(e)[:200]
                  print("  FAIL", m, flush=True)
                  failed.append(j["name"] + " :: " + m)
                  if "ZeroGPU" in m or "quota" in m.lower():
                      break

          print(json.dumps({"done": done, "failed": failed}, ensure_ascii=False))
          if not done:
              raise SystemExit("nothing rendered")

          ref = gh("GET", "/git/ref/heads/main")
          head = ref["object"]["sha"]
          tree = gh("GET", "/git/commits/" + head)["tree"]["sha"]
          adds, idx_entries = [], []
          for j in JOBS:
              p = os.path.join(OUT, j["name"] + ".mp4")
              if not os.path.exists(p):
                  continue
              b = gh("POST", "/git/blobs", {"content": base64.b64encode(open(p, "rb").read()).decode(),
                                            "encoding": "base64"})
              path = "gallery/videos/fit-noa/%s.mp4" % j["name"]
              adds.append({"path": path, "mode": "100644", "type": "blob", "sha": b["sha"]})
              idx_entries.append({"url": "https://aidoor.shimi.land/" + path, "char": "נועה",
                                  "folder": "videos/fit-noa",
                                  "title": j["name"] + " · " + j["heb"] + " · תנועה אמיתית"})

          cur = json.loads(base64.b64decode(gh("GET", "/contents/history-index.json")["content"]).decode())
          have = set(i.get("url") for i in cur["items"])
          new = [e for e in idx_entries if e["url"] not in have]
          if new:
              cur["items"] += new
              cur["count"] = len(cur["items"])
              ib = gh("POST", "/git/blobs", {"content": base64.b64encode(
                  json.dumps(cur, ensure_ascii=False, indent=1).encode()).decode(), "encoding": "base64"})
              adds.append({"path": "history-index.json", "mode": "100644", "type": "blob", "sha": ib["sha"]})

          t = gh("POST", "/git/trees", {"base_tree": tree, "tree": adds})
          c = gh("POST", "/git/commits", {"message": "Noa real motion: %d clips (actions render)" % len(done),
                                          "tree": t["sha"], "parents": [head]})
          gh("PATCH", "/git/refs/heads/main", {"sha": c["sha"]})
          print("committed", c["sha"], "clips", len(done))

          # ---- assemble labeled reel when all clips exist ----
          try:
              import glob, subprocess
              have = sorted(glob.glob(os.path.join(OUT, "*.mp4")))
              if len(have) == len(JOBS):
                  from PIL import Image, ImageDraw, ImageFont
                  W, H = 896, 832
                  FB = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
                  FR = "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"

                  def ctext(d, xy, txt, font, fill, rtl=True):
                      try:
                          d.text(xy, txt, font=font, fill=fill, direction="rtl" if rtl else None, anchor="ra")
                      except TypeError:
                          d.text(xy, txt, font=font, fill=fill)

                  def card(lines, path):
                      im = Image.new("RGB", (W, H), (12, 16, 23)); d = ImageDraw.Draw(im)
                      y = H // 2 - len(lines) * 45
                      for txt, size, col in lines:
                          f = ImageFont.truetype(FB if size > 30 else FR, size)
                          try:
                              b = d.textbbox((0, 0), txt, font=f, direction="rtl")
                          except TypeError:
                              b = d.textbbox((0, 0), txt, font=f)
                          d.text(((W - (b[2] - b[0])) // 2, y), txt, font=f, fill=col,
                                 direction="rtl") if size > 30 else d.text(((W - (b[2] - b[0])) // 2, y), txt, font=f, fill=col)
                          y += (b[3] - b[1]) + 34
                      im.save(path)

                  card([("שימי פיט", 28, (160, 170, 185)), ("נו\u05e2ה · תנועה אמיתית", 52, (245, 245, 250)),
                        ("14 תרגילי ישבן", 38, (187, 140, 232))], os.path.join(OUT, "c_intro.png"))
                  card([("נוצר על ידי קודה", 38, (235, 235, 242)),
                        ("גורם לא רשמי בסטודיו שימי", 26, (170, 175, 190))], os.path.join(OUT, "c_outro.png"))
                  parts = []
                  for i, j in enumerate(JOBS, 1):
                      ov = Image.new("RGBA", (W, H), (0, 0, 0, 0)); d = ImageDraw.Draw(ov)
                      d.rectangle([0, H - 120, W, H], fill=(10, 13, 19, 210))
                      ctext(d, (W - 40, H - 98), j["heb"], ImageFont.truetype(FB, 46), (245, 245, 250))
                      d.text((40, H - 88), "%d/%d" % (i, len(JOBS)), font=ImageFont.truetype(FR, 26), fill=(150, 158, 172))
                      cap = os.path.join(OUT, "cap_%d.png" % i); ov.save(cap)
                      lab = os.path.join(OUT, "lbl_%d.mp4" % i)
                      subprocess.run(["ffmpeg", "-y", "-loglevel", "error", "-i", os.path.join(OUT, j["name"] + ".mp4"),
                                      "-i", cap, "-filter_complex",
                                      "[0:v]scale=%d:%d:force_original_aspect_ratio=increase,crop=%d:%d,fps=25[v];[v][1:v]overlay=0:0[o]" % (W, H, W, H),
                                      "-map", "[o]", "-c:v", "libx264", "-preset", "medium", "-crf", "20",
                                      "-pix_fmt", "yuv420p", lab], check=True)
                      parts.append(lab)
                  lst = os.path.join(OUT, "reel.txt")
                  with open(lst, "w") as fh:
                      fh.write("file '%s'\nduration 2.5\n" % os.path.join(OUT, "c_intro.png"))
                      for p2 in parts:
                          fh.write("file '%s'\nduration 5.0\n" % p2)
                      fh.write("file '%s'\nduration 3.0\n" % os.path.join(OUT, "c_outro.png"))
                      fh.write("file '%s'\n" % os.path.join(OUT, "c_outro.png"))
                  reel = os.path.join(OUT, "noa_14_motion_reel.mp4")
                  subprocess.run(["ffmpeg", "-y", "-loglevel", "error", "-f", "concat", "-safe", "0", "-i", lst,
                                  "-vf", "fps=25,format=yuv420p", "-c:v", "libx264", "-preset", "medium",
                                  "-crf", "20", "-movflags", "+faststart", reel], check=True)
                  rb = gh("POST", "/git/blobs", {"content": base64.b64encode(open(reel, "rb").read()).decode(), "encoding": "base64"})
                  rpath = "gallery/videos/fit-noa/noa_14_motion_reel.mp4"
                  ref2 = gh("GET", "/git/ref/heads/main")
                  head2 = ref2["object"]["sha"]
                  tree2 = gh("GET", "/git/commits/" + head2)["tree"]["sha"]
                  t2 = gh("POST", "/git/trees", {"base_tree": tree2, "tree": [{"path": rpath, "mode": "100644", "type": "blob", "sha": rb["sha"]}]})
                  c2 = gh("POST", "/git/commits", {"message": "Noa motion reel (14 real-motion clips)", "tree": t2["sha"], "parents": [head2]})
                  gh("PATCH", "/git/refs/heads/main", {"sha": c2["sha"]})
                  print("reel committed", os.path.getsize(reel))
          except Exception as e:
              print("assemble skipped:", str(e)[:200])
          PYEOF
          python /tmp/r.py

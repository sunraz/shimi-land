name: render-queue
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}
concurrency:
  group: shimi-render-queue
  cancel-in-progress: false
jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: claim jobs
        env:
          RENDER_KEY: ${{ secrets.RENDER_KEY }}
        run: python scripts/render_queue_worker.py claim
      - name: render
        env:
          RENDER_KEY: ${{ secrets.RENDER_KEY }}
        run: python scripts/render_queue_worker.py render
      - name: commit results
        run: |
          git config user.name "shimi-render-bot"
          git config user.email "render@shimi.land"
          git add gallery/lora-renders/ || true
          git commit -m "queue render $(date -u +%FT%TZ)" || echo "nothing to commit"
          git pull --rebase --autostash || true
          git push || true
      - name: report back
        if: always()
        env:
          RENDER_KEY: ${{ secrets.RENDER_KEY }}
        run: python scripts/render_queue_worker.py complete

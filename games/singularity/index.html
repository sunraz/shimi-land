<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<title>SINGULARITY — אתה כוח הכבידה</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#05070c;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:none}
  #c{position:fixed;inset:0;display:block;width:100%;height:100%}
  .ui{position:fixed;inset:0;pointer-events:none;z-index:5}
  #hud{opacity:0;transition:opacity .25s}
  #hud.on{opacity:1}
  .score{position:absolute;top:max(14px,env(safe-area-inset-top));right:18px;text-align:right}
  .score b{display:block;font-size:clamp(34px,11vw,54px);font-weight:800;line-height:1;color:#eef3ff;
    text-shadow:0 0 18px rgba(120,180,255,.55);font-variant-numeric:tabular-nums}
  .score span{font-size:11px;letter-spacing:.18em;color:#7d8aa3;text-transform:uppercase}
  .combo{position:absolute;top:calc(max(14px,env(safe-area-inset-top)) + 74px);right:18px;font-size:clamp(18px,5.5vw,26px);
    font-weight:800;color:#ffd166;opacity:0;transform:scale(.7);transition:transform .12s,opacity .18s;text-shadow:0 0 14px rgba(255,190,60,.6)}
  .combo.on{opacity:1;transform:scale(1)}
  .hearts{position:absolute;top:max(16px,env(safe-area-inset-top));left:18px;display:flex;gap:7px;font-size:20px;line-height:1}
  .heart{filter:drop-shadow(0 0 6px rgba(255,80,90,.7));transition:transform .2s,opacity .2s}
  .heart.gone{opacity:.16;transform:scale(.75);filter:none}
  .gauge{position:absolute;left:18px;right:18px;bottom:max(16px,env(safe-area-inset-bottom));height:9px;border-radius:6px;
    background:rgba(255,255,255,.09);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
  .gauge i{display:block;height:100%;width:0%;border-radius:6px;background:linear-gradient(90deg,#4ad2ff,#ffd166 55%,#ff4d6d);
    transition:width .12s linear}
  .glabel{position:absolute;left:18px;bottom:calc(max(16px,env(safe-area-inset-bottom)) + 15px);font-size:11px;letter-spacing:.16em;
    color:#7d8aa3;text-transform:uppercase}
  .vent{position:absolute;right:18px;bottom:calc(max(16px,env(safe-area-inset-bottom)) + 34px);width:86px;height:86px;border-radius:50%;
    border:2px solid rgba(255,209,102,.5);background:rgba(255,209,102,.1);color:#ffd166;font-weight:800;font-size:12px;
    letter-spacing:.1em;pointer-events:auto;display:flex;align-items:center;justify-content:center;text-align:center;
    transition:transform .1s,box-shadow .2s;line-height:1.2}
  .vent:active{transform:scale(.92);box-shadow:0 0 26px rgba(255,209,102,.5)}
  .vent.cool{opacity:.35;border-color:rgba(255,255,255,.18);color:#8b94a6}
  #splash,#over{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;text-align:center;padding:28px;background:radial-gradient(120% 90% at 50% 40%,rgba(20,30,60,.92),rgba(3,5,10,.97));
    z-index:9;transition:opacity .3s}
  .hide{opacity:0;pointer-events:none}
  h1{font-size:clamp(30px,9vw,46px);font-weight:900;letter-spacing:.06em;color:#fff;text-shadow:0 0 30px rgba(90,160,255,.7)}
  .sub{color:#9fb0cc;font-size:15px;max-width:340px;line-height:1.65}
  .kbd{color:#ffd166;font-weight:700}
  .btn{margin-top:6px;padding:15px 40px;border-radius:999px;border:none;font-size:17px;font-weight:800;letter-spacing:.04em;
    background:linear-gradient(135deg,#4ad2ff,#7a6bff);color:#04121e;box-shadow:0 10px 34px rgba(74,210,255,.35);
    pointer-events:auto;cursor:pointer}
  .btn:active{transform:scale(.96)}
  .best{color:#7d8aa3;font-size:13px;letter-spacing:.1em}
  #over h2{font-size:40px;color:#ff6b81;text-shadow:0 0 26px rgba(255,80,110,.55)}
  #over .big{font-size:56px;font-weight:900;color:#fff;line-height:1}
  .tag{font-size:12px;letter-spacing:.2em;color:#66738c;text-transform:uppercase}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="ui" id="hud">
  <div class="hearts" id="hearts"></div>
  <div class="score"><b id="score">0</b><span>score</span></div>
  <div class="combo" id="combo">×1</div>
  <div class="glabel">CORE DENSITY</div>
  <div class="gauge"><i id="dens"></i></div>
  <div class="vent" id="vent">VENT</div>
</div>

<div id="splash">
  <h1>SINGULARITY</h1>
  <div class="sub">אתה כוח הכבידה.<br>גרור אצבע — החלל מתכופף סביבך.<br>כל שביט שנתפס מעלה את <span class="kbd">הצפיפות</span>.<br>ב-100% הלוע קורס ואתה מת.</div>
  <div class="sub" style="font-size:13.5px;color:#7f8ea8">שביט שבורח מהמסך עולה לך לב.<br>לחץ <span class="kbd">VENT</span> כדי לפרוק צפיפות — במחיר הקומבו.</div>
  <button class="btn" id="play">שחק</button>
  <div class="best" id="best1"></div>
</div>

<div id="over" class="hide">
  <div class="tag">CORE COLLAPSED</div>
  <h2>קריסה</h2>
  <div class="big" id="fs">0</div>
  <div class="best" id="best2"></div>
  <div class="sub" id="verdict"></div>
  <button class="btn" id="again">עוד סיבוב</button>
</div>

<script>
(() => {
'use strict';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
const E = { score: 0, best: +(localStorage.getItem('sing_best') || 0), runs: +(localStorage.getItem('sing_runs') || 0) };

let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.floor(W * DPR); cv.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

/* ---------- audio: no assets, all synthesized ---------- */
let AC = null, master = null;
function audioInit() {
  if (AC) return;
  const Ctx = window.AudioContext || window.webkitAudioContext; if (!Ctx) return;
  AC = new Ctx();
  master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
}
function tone(freq, dur, type = 'sine', vol = 0.22, slideTo = null) {
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, AC.currentTime);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, AC.currentTime + dur);
  g.gain.setValueAtTime(vol, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0008, AC.currentTime + dur);
  o.connect(g); g.connect(master); o.start(); o.stop(AC.currentTime + dur + 0.02);
}
function noise(dur = 0.25, vol = 0.25, hp = 400) {
  if (!AC) return;
  const n = AC.sampleRate * dur, buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = AC.createBufferSource(); src.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
  const g = AC.createGain(); g.gain.setValueAtTime(vol, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0008, AC.currentTime + dur);
  src.connect(f); f.connect(g); g.connect(master); src.start();
  src.stop(AC.currentTime + dur);
}
const PENTA = [0, 3, 5, 7, 10, 12, 15, 17, 19];
function captureSound(combo) {
  const semi = PENTA[Math.min(combo - 1, PENTA.length - 1)] || 0;
  tone(320 * Math.pow(2, semi / 12), 0.16, 'triangle', 0.24, 480 * Math.pow(2, semi / 12));
  tone(640 * Math.pow(2, semi / 12), 0.09, 'sine', 0.1);
}
function missSound() { tone(180, 0.3, 'sawtooth', 0.2, 70); noise(0.15, 0.14, 500); }
function ventSound() { noise(0.35, 0.22, 900); tone(420, 0.3, 'sine', 0.12, 130); }
function deathSound() { noise(0.9, 0.4, 120); tone(120, 1.1, 'sawtooth', 0.3, 32); }

function haptic(ms) { if (navigator.vibrate) try { navigator.vibrate(ms); } catch (e) {} }

/* ---------- state ---------- */
const ST = { MENU: 0, PLAY: 1, DEAD: 2 };
let state = ST.MENU;
const well = { x: 0, y: 0, tx: 0, ty: 0, r: 16, pull: 0, pulse: 0 };
let comets = [], parts = [], rings = [], texts = [], stars = [];
let score = 0, combo = 0, comboT = 0, lives = 3, density = 0, ventCd = 0, shake = 0, hitstop = 0;
let spawnT = 0, elapsed = 0, flash = 0, hue = 210;
const input = { down: false, x: 0, y: 0 };
const VENT_CD = 1.35, VENT_RELIEF = 0.34;

function reset() {
  score = 0; combo = 0; comboT = 0; lives = 3; density = 0; ventCd = 0;
  comets = []; parts = []; rings = []; texts = []; shake = 0; hitstop = 0;
  spawnT = 0.35; elapsed = 0; flash = 0;
  well.x = W / 2; well.y = H * 0.55; well.tx = well.x; well.ty = well.y;
  stars = Array.from({ length: 90 }, () => ({
    x: Math.random() * W, y: Math.random() * H, z: 0.3 + Math.random() * 0.7, s: Math.random() * 1.6 + 0.3
  }));
  drawHUD();
}
function startRun() {
  audioInit(); if (AC && AC.state === 'suspended') AC.resume();
  reset(); state = ST.PLAY;
  document.getElementById('splash').classList.add('hide');
  document.getElementById('over').classList.add('hide');
  document.getElementById('hud').classList.add('on');
  E.runs++; localStorage.setItem('sing_runs', E.runs);
}
function gameOver() {
  state = ST.DEAD; deathSound(); shake = 26; flash = 1;
  if (score > E.best) { E.best = score; localStorage.setItem('sing_best', E.best); }
  document.getElementById('fs').textContent = score;
  document.getElementById('best2').textContent = 'שיא: ' + E.best;
  let v = 'עוד לא תפסת קצב.';
  if (score >= 400) v = 'הלוע שלך רעב.';
  if (score >= 1200) v = 'זה כבר התמכרות.';
  if (score >= 3000) v = 'אף אחד לא אמור להגיע לכאן.';
  document.getElementById('verdict').textContent = v;
  document.getElementById('over').classList.remove('hide');
  document.getElementById('hud').classList.remove('on');
}

/* ---------- entities ---------- */
function spawnComet() {
  const edge = Math.floor(Math.random() * 4);
  const m = 44; let x, y, vx, vy;
  const speed = 62 + elapsed * 4.2 + density * 70 + Math.random() * 34;
  if (edge === 0) { x = -m; y = Math.random() * H; vx = speed; vy = (Math.random() - 0.5) * 70; }
  else if (edge === 1) { x = W + m; y = Math.random() * H; vx = -speed; vy = (Math.random() - 0.5) * 70; }
  else if (edge === 2) { x = Math.random() * W; y = -m; vx = (Math.random() - 0.5) * 70; vy = speed; }
  else { x = Math.random() * W; y = H + m; vx = (Math.random() - 0.5) * 70; vy = -speed; }
  const big = Math.random() < 0.12;
  comets.push({ x, y, vx, vy, r: big ? 12 : 7, mass: big ? 2.2 : 1, trail: [], gold: big, born: 0 });
}

function pop(x, y, color, n = 12, spd = 190) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = spd * (0.35 + Math.random());
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.55 + Math.random() * 0.3, t: 0, c: color, r: 1.4 + Math.random() * 2.4 });
  }
}

function capture(c) {
  combo++; comboT = 1.35;
  const gain = Math.round(10 * Math.min(combo, 12));
  score += gain;
  density = Math.min(1, density + 0.055 * c.mass);
  pop(c.x, c.y, c.gold ? '#ffd166' : '#7fe0ff', c.gold ? 26 : 15, c.gold ? 300 : 200);
  rings.push({ x: c.x, y: c.y, r: 6, max: c.gold ? 120 : 74, t: 0, c: c.gold ? '255,209,102' : '127,224,255' });
  texts.push({ x: c.x, y: c.y, txt: '+' + gain, t: 0, c: c.gold ? '#ffd166' : '#dff3ff' });
  captureSound(combo);
  haptic(c.gold ? 22 : 10);
  shake = Math.min(14, 3 + combo * 0.5); hitstop = 0.035; flash = Math.max(flash, 0.12);
  if (density >= 1) { gameOver(); }
  drawHUD();
}

function miss(c) {
  lives--; combo = 0; comboT = 0;
  missSound(); haptic(38); shake = 16; flash = 0.5;
  drawHUD();
  if (lives <= 0) gameOver();
}

function vent() {
  if (ventCd > 0 || density <= 0.06 || state !== ST.PLAY) return;
  density = Math.max(0, density - VENT_RELIEF);
  ventCd = VENT_CD; combo = 0; comboT = 0;
  ventSound(); haptic(14);
  for (let i = 0; i < 34; i++) {
    const a = Math.random() * Math.PI * 2, s = 120 + Math.random() * 320;
    parts.push({ x: well.x, y: well.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.7, t: 0, c: '#ff4d6d', r: 1 + Math.random() * 2 });
  }
  rings.push({ x: well.x, y: well.y, r: 20, max: 200, t: 0, c: '255,77,109' });
  drawHUD();
}

/* ---------- input ---------- */
const fxc = document.getElementById('c');
function pt(e) {
  const r = cv.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
fxc.addEventListener('pointerdown', e => {
  fxc.setPointerCapture?.(e.pointerId);
  input.down = true;
  const p = pt(e); input.x = p.x; input.y = p.y; well.tx = p.x; well.ty = p.y;
  if (state === ST.PLAY) { well.pull = 1; }
}, { passive: true });
fxc.addEventListener('pointermove', e => {
  const p = pt(e); input.x = p.x; input.y = p.y; well.tx = p.x; well.ty = p.y;
}, { passive: true });
function up() { input.down = false; well.pull = 0; }
fxc.addEventListener('pointerup', up, { passive: true });
fxc.addEventListener('pointercancel', up, { passive: true });
fxc.addEventListener('pointerleave', up, { passive: true });

document.getElementById('vent').addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); vent(); });
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.key === ' ') { e.preventDefault(); vent(); }
  if (e.key === 'Enter') { if (state !== ST.PLAY) startRun(); }
});
document.getElementById('play').addEventListener('click', startRun);
document.getElementById('again').addEventListener('click', startRun);

/* ---------- hud ---------- */
function drawHUD() {
  document.getElementById('score').textContent = score;
  const cb = document.getElementById('combo');
  cb.textContent = '×' + Math.max(1, combo);
  cb.classList.toggle('on', combo >= 2);
  const d = document.getElementById('dens');
  d.style.width = Math.round(density * 100) + '%';
  const hh = document.getElementById('hearts');
  hh.innerHTML = '';
  for (let i = 0; i < 3; i++) {
    const s = document.createElement('span');
    s.className = 'heart' + (i < 3 - (3 - lives) ? '' : ' gone');
    s.textContent = '♥';
    hh.appendChild(s);
  }
  document.getElementById('vent').classList.toggle('cool', ventCd > 0);
}

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  dt = Math.min(dt, 0.05);
  if (hitstop > 0) { hitstop -= dt; dt *= 0.25; }
  if (state === ST.PLAY) update(dt);
  else idle(dt);
  render(dt);
  requestAnimationFrame(frame);
}

function idle(dt) {
  well.x += (well.tx - well.x) * Math.min(1, dt * 8);
  well.y += (well.ty - well.y) * Math.min(1, dt * 8);
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.t += dt; if (p.t > p.life) { parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96;
  }
  if (flash > 0) flash = Math.max(0, flash - dt * 2.2);
  if (shake > 0) shake = Math.max(0, shake - dt * 40);
}

function update(dt) {
  elapsed += dt;
  ventCd = Math.max(0, ventCd - dt);
  if (comboT > 0) { comboT -= dt; if (comboT <= 0) { combo = 0; drawHUD(); } }
  if (flash > 0) flash = Math.max(0, flash - dt * 2.2);
  if (shake > 0) { shake = Math.max(0, shake - dt * 40); if (shake === 0) drawHUD(); }

  // well follows finger fast but smoothly
  well.x += (well.tx - well.x) * Math.min(1, dt * 18);
  well.y += (well.ty - well.y) * Math.min(1, dt * 18);
  well.pulse += dt * (6 + density * 10);

  // spawn rate climbs with time and density: pressure that never lets up
  spawnT -= dt;
  const interval = Math.max(0.24, 1.05 - elapsed * 0.028 - density * 0.35);
  if (spawnT <= 0) { spawnComet(); spawnT = interval * (0.75 + Math.random() * 0.6); }

  const G = 360000 * (1 + well.pull * 0.55) * (1 + density * 0.5);
  const R = 26 + Math.min(combo, 12) * 1.6;

  for (let i = comets.length - 1; i >= 0; i--) {
    const c = comets[i];
    c.born += dt;
    const dx = well.x - c.x, dy = well.y - c.y;
    const d2 = dx * dx + dy * dy + 340;
    const d = Math.sqrt(d2);
    const f = (G * c.mass) / d2;
    c.vx += (dx / d) * f * dt; c.vy += (dy / d) * f * dt;
    // subtle drag so orbits tighten
    c.vx *= (1 - 0.12 * dt); c.vy *= (1 - 0.12 * dt);
    c.x += c.vx * dt; c.y += c.vy * dt;
    c.trail.push({ x: c.x, y: c.y });
    if (c.trail.length > 9) c.trail.shift();

    if (d < R + c.r) { capture(c); comets.splice(i, 1); continue; }

    const out = (c.x < -70 || c.x > W + 70 || c.y < -70 || c.y > H + 70);
    if (out && c.born > 0.4) { miss(c); comets.splice(i, 1); continue; }
  }

  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.t += dt; if (p.t > p.life) { parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94;
  }
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i]; r.t += dt * 2.1;
    r.r += (r.max - r.r) * Math.min(1, dt * 7);
    if (r.t > 1) rings.splice(i, 1);
  }
  for (let i = texts.length - 1; i >= 0; i--) {
    const t = texts[i]; t.t += dt; t.y -= dt * 46;
    if (t.t > 0.85) texts.splice(i, 1);
  }
  hue = 210 - density * 190;
  document.getElementById('vent').classList.toggle('cool', ventCd > 0);
}

function render(dt) {
  // background: deep space with density-driven heat
  const heat = Math.min(1, density);
  const g = ctx.createRadialGradient(well.x, well.y, 0, well.x, well.y, Math.max(W, H) * 0.9);
  g.addColorStop(0, `rgb(${Math.round(14 + heat * 70)},${Math.round(20 + heat * 24)},${Math.round(38 - heat * 22)})`);
  g.addColorStop(1, '#04060b');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  ctx.save();
  if (shake > 0.4) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  // stars with parallax-ish pull
  for (const s of stars) {
    const dx = well.x - s.x, dy = well.y - s.y, d = Math.hypot(dx, dy) + 1;
    const k = Math.min(16, 4200 / d) * s.z * 0.06;
    const px = s.x + (dx / d) * k, py = s.y + (dy / d) * k;
    ctx.globalAlpha = 0.18 + s.z * 0.5;
    ctx.fillStyle = '#cfe3ff';
    ctx.fillRect(px, py, s.s, s.s);
  }
  ctx.globalAlpha = 1;

  // rings
  for (const r of rings) {
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(${r.c},${Math.max(0, 1 - r.t) * 0.8})`;
    ctx.lineWidth = 2.4 * (1 - r.t) + 0.4;
    ctx.stroke();
  }

  // comets
  for (const c of comets) {
    for (let i = 0; i < c.trail.length; i++) {
      const t = c.trail[i], a = (i / c.trail.length) * 0.5;
      ctx.globalAlpha = a;
      ctx.fillStyle = c.gold ? '#ffd166' : '#8ad8ff';
      ctx.beginPath(); ctx.arc(t.x, t.y, c.r * (i / c.trail.length) * 0.9, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    const grad = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.r * 3.2);
    grad.addColorStop(0, c.gold ? '#fff3cf' : '#ffffff');
    grad.addColorStop(0.35, c.gold ? 'rgba(255,209,102,.85)' : 'rgba(138,216,255,.8)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(c.x, c.y, c.r * 3.2, 0, Math.PI * 2); ctx.fill();
  }

  // the well
  const pr = well.r * (1 + Math.sin(well.pulse) * 0.08) * (1 + Math.min(combo, 12) * 0.02);
  const wg = ctx.createRadialGradient(well.x, well.y, 0, well.x, well.y, pr * 6);
  wg.addColorStop(0, 'rgba(255,255,255,.95)');
  wg.addColorStop(0.16, `hsla(${hue},100%,72%,.85)`);
  wg.addColorStop(0.45, `hsla(${hue + 30},100%,55%,.22)`);
  wg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = wg;
  ctx.beginPath(); ctx.arc(well.x, well.y, pr * 6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(well.x, well.y, pr * 0.62, 0, Math.PI * 2); ctx.fill();

  // capture radius hint while pulling
  if (well.pull > 0) {
    ctx.beginPath();
    ctx.arc(well.x, well.y, 26 + Math.min(combo, 12) * 1.6, 0, Math.PI * 2);
    ctx.strokeStyle = `hsla(${hue},100%,70%,.25)`;
    ctx.lineWidth = 1.2; ctx.stroke();
  }

  // particles
  for (const p of parts) {
    const a = 1 - p.t / p.life;
    ctx.globalAlpha = a * 0.9; ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * a + 0.4, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // floating score
  for (const t of texts) {
    ctx.globalAlpha = Math.max(0, 1 - t.t / 0.85);
    ctx.fillStyle = t.c; ctx.font = '800 22px system-ui,Arial'; ctx.textAlign = 'center';
    ctx.fillText(t.txt, t.x, t.y);
  }
  ctx.globalAlpha = 1; ctx.textAlign = 'start';

  ctx.restore();

  if (flash > 0.01) {
    ctx.fillStyle = `rgba(255,225,180,${flash * 0.28})`;
    ctx.fillRect(0, 0, W, H);
  }
}

reset();
document.getElementById('best1').textContent = E.best ? 'שיא: ' + E.best : '';
requestAnimationFrame(frame);
})();
</script>
